{{- if .Values.genesis_proxy }}
apiVersion: v1
kind: Service
metadata:
  name: titan
  namespace: {{ .Release.Namespace }}
spec:
  type: ExternalName
  externalName: titan.{{ coalesce (get (.Values.hubble.env | default dict) "GENESIS_NAMESPACE") (get (.Values.kuiper.env | default dict) "GENESIS_NAMESPACE") .Values.genesis_namespace }}.svc.cluster.local
  ports:
    - port: 8000
      targetPort: 8000
{{- end }}
